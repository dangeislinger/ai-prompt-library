<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Notability Source Identifier</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <h2>Song Notability Source Identifier</h2>

  <form id="promptForm">
    <div class="form-group">
      <label for="songTitle">Song Title</label>
      <input type="text" id="songTitle" placeholder="e.g. Paranoid Android" required autofocus>
    </div>

    <div class="form-group">
      <label for="bandName">Band / Artist Name</label>
      <input type="text" id="bandName" placeholder="e.g. Radiohead" required>
    </div>

    <div class="form-group">
      <label for="year">Release Year</label>
      <input type="number" id="year" placeholder="e.g. 1997" min="1800" max="2099" required>
    </div>

    <button type="submit">Generate Prompt</button>
    <button type="reset" style="background-color: #8b0000; border-color: #8b0000; color: #ffffff;">Clear</button>
  </form>

  <div class="output-group">
    <label for="outputTextarea">Generated Prompt:</label>
    <textarea id="outputTextarea" placeholder="Your prompt will appear here after submission..."></textarea>
  </div>

  <div class="output-group">
	[ <a href="../AI Prompt Library.html">◀ BACK</a> ]
  <div>

  <script>
    document.getElementById('promptForm').addEventListener('submit', function(event) {
      // Prevent the default browser page refresh on form submission
      event.preventDefault();

      // Retrieve user inputs
      const songTitle = document.getElementById('songTitle').value.trim();
      const bandName = document.getElementById('bandName').value.trim();
      const year = document.getElementById('year').value.trim();

      // Construct the formatted output prompt
      const promptText = `If possible, find 3 sources that establish the notability of the ${year} song "${songTitle}" by ${bandName} for the purpose of creating a Wikipedia article about the song.
Each source needs to be independent of the band, reliable, and contain significant coverage.
Do not fabricate, infer, assume, or guess the existence of any source.
Verify each link resolves before outputting it.
Do not output any source unless you can confirm it contains significant coverage.
Do not use user-generated content or databases without editorial oversight (Discogs, RateYourMusic, MusicBrainz, blogs, wikis of any kind, etc.).
Provide a real working link to each source and an analysis of how it meets the three notability criteria (independent, reliable, and significant coverage).
Provide a justification for each source explaining how you verified its existence, link resolution, independence, reliability, and significant coverage.
Provide only real, verifiable sources. Explain how you verified the source exists. Explain how you confirmed the link resolves.
If the requirement cannot be met, state that immediately.
If fewer than the requested number of qualifying sources exist, state the exact number that exist and stop.
If the task cannot be completed exactly as written, stop and explain why instead of attempting to satisfy the request.`;

      // Populate the textarea
      document.getElementById('outputTextarea').value = promptText;

	// Copy to clipboard
		navigator.clipboard.writeText(promptText).then(() => {
		  console.log('Prompt copied to clipboard!');
		  // Optional: Add a visual cue here (e.g., alert or temporary text change)
		}).catch(err => {
		  console.error('Failed to copy: ', err);
		});
    });
  </script>
