<!-- START REDIRECT TEMPLATE BUTTON -->
    <button id="copyButton">Redirect Template  ➡️ 📋</button>

    <script>
        const textToCopy = `#REDIRECT [[Article goes here#And_a_section_here]]

{{Redirect category shell|
{{R from song}}
{{R from album}}
{{R from member}}
{{R from band name}}

{{R to section}}
{{R from subtopic}}

{{R to related topic}}
{{R from alternative name}}
{{R from punctuation}}
{{R from company name}}
{{R from acronym}}

{{R with history}}
{{R with Wikidata item}}
{{R from merge}}
}}`;

        document.getElementById('copyButton').addEventListener('click', function() {
            navigator.clipboard.writeText(textToCopy).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        });
    </script>
<!-- END REDIRECT TEMPLATE BUTTON -->
<br>
<br>
